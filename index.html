<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <script src="jogo.js" defer></script> 
</head>
<body>
    <header>
        <h1>Jogo de Adivinhação</h1>
        <p>O objetivo do jogo consiste em adivinhar um número entre 1 e 100. Você tem 10 chances!</p>
        <p>O jogo dará dicas ao jogador</p>
    </header>
    <label for="palpite">Palpite</label>
    <input type="number" id="palpite" min="1" max="100" placeholder="0">
    <p id="resultado"></p>
    <button id="btChutar">Chutar</button>
    <p>Dicas:</p>
    <p id="mensagemJogo" class="mensagem">Boa sorte!</p>
    <p id="tentativasRestantes">Tentativas restantes: 10</p>
</body>
</html>
